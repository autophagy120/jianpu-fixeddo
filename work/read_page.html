<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>演奏阅读</title>
<style>
:root{--bg:#0b0e12;--panel:#151b23;--line:#2b333d;--fg:#e8ecf1;--dim:#94a0ae;--acc:#4da3ff;--warn:#ffd166}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.5 "Microsoft YaHei","Segoe UI",sans-serif;overflow:hidden}
#bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
#bar .t{color:var(--dim);font-size:12px}
#bar b{color:var(--warn)}
button,select{background:#26313d;color:var(--fg);border:1px solid var(--line);border-radius:7px;
  padding:6px 11px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--acc)}button:disabled{opacity:.45;cursor:default}
#stage{position:absolute;left:0;right:0;top:52px;bottom:56px;display:grid;gap:10px;
  padding:10px;align-content:center;justify-content:center;overflow:auto}
.cell{display:flex;align-items:center;justify-content:center;overflow:hidden}
.cell img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:4px;
  box-shadow:0 6px 24px rgba(0,0,0,.6)}
#strip{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;
  gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
.chip{min-width:44px;text-align:center;background:#222b35;border:1px solid var(--line);
  border-radius:99px;padding:4px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:#1d4e79;border-color:var(--acc);color:#fff}
#hint{color:var(--dim);font-size:12px;margin-left:auto}
#load{position:fixed;inset:0;background:rgba(6,8,11,.78);display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:14px;z-index:99}
#load .bar{width:320px;height:8px;background:#1d2632;border-radius:99px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--acc);transition:.2s}
#msg{color:var(--dim);font-size:13px}
.hidden{display:none!important}
</style></head><body>
<div id="bar">
  <button onclick="location.href='/lib'">← 乐谱库</button>
  <span class="t" id="name">—</span>
  <span class="t" id="pageinfo"></span>
  <span class="t">方式</span>
  <select id="mode" onchange="onMode()">
    <option value="transpose">转调</option>
    <option value="dizi">竹笛指法</option>
  </select>
  <span id="trBox"><span class="t">转到</span>
    <select id="target" onchange="rebuild()"></select>
  </span>
  <span id="dzBox" class="hidden"><span class="t">笛调</span>
    <select id="dizi" onchange="rebuild()"></select>
    <span class="t">筒音做</span>
    <select id="tongyin" onchange="rebuild()">
      <option>1</option><option>2</option><option>3</option><option>4</option>
      <option selected>5</option><option>6</option><option>7</option>
    </select>
  </span>
  <span class="t" id="realKey"></span>
  <span class="sp" style="flex:1"></span>
  <button onclick="zoom(-1)">－</button><span class="t" id="zl">100%</span><button onclick="zoom(1)">＋</button>
  <button onclick="fit()">适应</button>
  <button onclick="maximize()">全屏</button>
</div>
<div id="stage"></div>
<div id="strip"></div>
<div id="load"><div id="msg">准备中…</div><div class="bar"><i id="pg"></i></div></div>

<script>
var KEYS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var PI={};   // 页信息
var INFO=null, TARGET='C', IMGS={}, ZOOM=1;
var screens=[], cur=0;

function $(id){return document.getElementById(id);}
function fillSelect(el, list, cur0){
  el.innerHTML=list.map(function(k){return '<option value="'+k+'">1='+k+'</option>';}).join('');
  if(cur0) el.value=cur0;
}
function initSelects(){
  fillSelect($('target'), KEYS, 'C');
  fillSelect($('dizi'), KEYS, 'G');
}
async function boot(){
  initSelects();
  var id=new URLSearchParams(location.search).get('id')||'';
  if(!id){ $('msg').textContent='没有指定谱子：请从乐谱库里点「演奏阅读」'; return; }
  var r=await fetch('/api/read_info?id='+encodeURIComponent(id)).then(function(x){return x.json();});
  INFO=r; PI={};
  (r.pages||[]).forEach(function(p){PI[p.id]=p;});
  $('name').textContent=(r.group_name||'')+((r.pages||[]).length>1?('　'+(r.pages||[]).length+' 页'):'');
  // 默认目标：跟随这份谱自己的调
  var selfKey=(r.pages&&r.pages[0]&&r.pages[0].key)||'C';
  $('target').value = (KEYS.indexOf(selfKey)>=0? selfKey : 'C');
  TARGET=$('target').value;
  await rebuild();
}
function onMode(){
  var d=$('mode').value==='dizi';
  $('trBox').classList.toggle('hidden', d);
  $('dzBox').classList.toggle('hidden', !d);
  rebuild();
}
async function resolveTarget(){
  if($('mode').value==='dizi'){
    var r=await fetch('/api/read_map?dizi='+encodeURIComponent($('dizi').value)+
                      '&tongyin='+encodeURIComponent($('tongyin').value)).then(function(x){return x.json();});
    TARGET=r.key||'C';
    $('realKey').textContent='（实际 1='+TARGET+'）';
  }else{
    TARGET=$('target').value||'C';
    $('realKey').textContent='';
  }
}
function plan(N){
  if(N<=1) return {per:1, rows:1, cols:1};
  if(N===2) return {per:2, rows:1, cols:2};
  if(N===3) return {per:3, rows:1, cols:3};
  if(N===4) return {per:2, rows:1, cols:2};
  return {per:4, rows:2, cols:2};
}
function buildScreens(){
  var pages=INFO.pages||[], N=pages.length, p=plan(N);
  screens=[];
  for(var i=0;i<N;i+=p.per){ screens.push(pages.slice(i,i+p.per)); }
  screens.forEach(function(s){ s._rows=p.rows; s._cols=p.cols; });
}
async function rebuild(){
  $('load').classList.remove('hidden');
  await resolveTarget();
  var pages=INFO.pages||[];
  buildScreens();
  IMGS={}; 
  var total=pages.length, done=0;
  $('msg').textContent='预渲染 0/'+total+'（1='+TARGET+'）';
  $('pg').style.width='0%';
  // 串行预取：服务端渲染一页缓存一页，翻页时就是本地切图
  for(var k=0;k<pages.length;k++){
    var p=pages[k];
    var url='/readimg?id='+encodeURIComponent(p.id)+'&k='+encodeURIComponent(TARGET)+'&t='+Date.now();
    try{
      var img=await loadImg(url);
      IMGS[p.id]=img;
    }catch(e){}
    done++;
    $('msg').textContent='预渲染 '+done+'/'+total+'（1='+TARGET+'）';
    $('pg').style.width=Math.round(done*100/total)+'%';
  }
  $('load').classList.add('hidden');
  cur=0; render(); renderStrip();
  history.replaceState(null,'','/read?id='+encodeURIComponent(pages[0].id));
}
function loadImg(url){
  return new Promise(function(res,rej){
    var im=new Image();
    im.onload=function(){res(im);};
    im.onerror=function(){rej(new Error('load fail'));};
    im.src=url;
  });
}
function render(){
  var st=$('stage'), sc=screens[cur]||[];
  st.innerHTML='';
  st.style.gridTemplateColumns='repeat('+(sc._cols||1)+', minmax(0,1fr))';
  st.style.gridTemplateRows='repeat('+(sc._rows||1)+', minmax(0,1fr))';
  sc.forEach(function(p){
    var cell=document.createElement('div'); cell.className='cell';
    var img=IMGS[p.id];
    if(img){ var im=document.createElement('img'); im.src=img.src;
      im.style.maxWidth=Math.round(ZOOM*100)+'%'; im.style.maxHeight=Math.round(ZOOM*100)+'%';
      cell.appendChild(im); }
    st.appendChild(cell);
  });
  var total=(INFO.pages||[]).length;
  $('pageinfo').textContent=(total?('第 '+sc[0].idx+'-'+sc[sc.length-1].idx+' / '+total+' 页'):'');
}
function renderStrip(){
  var strip=$('strip'); strip.innerHTML='';
  screens.forEach(function(sc,i){
    var b=document.createElement('div'); b.className='chip'+(i===cur?' on':'');
    b.textContent=(sc[0].idx===sc[sc.length-1].idx? String(sc[0].idx)
                   : sc[0].idx+'-'+sc[sc.length-1].idx);
    b.onclick=function(){cur=i; render(); renderStrip();};
    strip.appendChild(b);
  });
  var h=document.createElement('span'); h.id='hint';
  h.textContent='点右半屏翻下一组 · 左半屏回上一组 · ←/→/空格';
  strip.appendChild(h);
}
function flip(d){
  var n=cur+d;
  if(n<0||n>=screens.length) return;
  cur=n; render(); renderStrip();
}
document.addEventListener('click',function(e){
  if(e.target.closest('#bar')||e.target.closest('#strip')) return;
  var w=window.innerWidth;
  if(e.clientX > w*0.5) flip(1); else flip(-1);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();flip(1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();flip(-1);}
  if(e.key==='+'||e.key==='='){zoom(1);}
  if(e.key==='-'){zoom(-1);}
  if(e.key==='Home'){cur=0;render();renderStrip();}
  if(e.key==='End'){cur=screens.length-1;render();renderStrip();}
});
function zoom(d){
  ZOOM=Math.max(0.5, Math.min(3, ZOOM+(d>0?0.15:-0.15)));
  $('zl').textContent=Math.round(ZOOM*100)+'%';
  document.querySelectorAll('.cell img').forEach(function(im){
    im.style.maxWidth=(ZOOM*100)+'%'; im.style.maxHeight=(ZOOM*100)+'%';
  });
}
function fit(){ ZOOM=1; $('zl').textContent='100%';
  document.querySelectorAll('.cell img').forEach(function(im){ im.style.maxWidth='100%'; im.style.maxHeight='100%'; }); }
function maximize(){
  var el=document.documentElement;
  if(!document.fullscreenElement){ el.requestFullscreen&&el.requestFullscreen(); }
  else document.exitFullscreen&&document.exitFullscreen();
}
boot();
</script></body></html>
